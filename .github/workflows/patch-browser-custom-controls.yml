name: Patch browser custom controls

on:
  push:
    branches:
      - refactor/kasha-core
    paths:
      - .github/workflows/patch-browser-custom-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kasha-core
          fetch-depth: 0
      - name: Patch custom controls and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/studio_browser.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "click('radio','Задача')": "page.get_by_text('Задача',exact=True).click()",
              "click('radio','А-Я')": "page.get_by_text('А-Я',exact=True).click()",
              "click('radio','Создано')": "page.get_by_text('Создано',exact=True).click()",
              "click('radio','Изменено')": "page.get_by_text('Изменено',exact=True).click()",
              "click('radio','Вручную')": "page.get_by_text('Вручную',exact=True).click()",
          }
          expected = {
              "click('radio','Задача')": 2,
              "click('radio','А-Я')": 2,
              "click('radio','Создано')": 1,
              "click('radio','Изменено')": 1,
              "click('radio','Вручную')": 2,
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != expected[old]:
                  raise SystemExit(f'expected {expected[old]} occurrences, found {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/patch-browser-custom-controls.yml
          git config user.name "Kasha Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/studio_browser.py
          git commit -m "Drive custom segmented controls by visible text in browser E2E"
          git push origin HEAD:refactor/kasha-core
