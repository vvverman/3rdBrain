name: Patch browser home return

on:
  push:
    branches:
      - refactor/kasha-core
    paths:
      - .github/workflows/patch-browser-home-return.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kasha-core
          fetch-depth: 0
      - name: Patch E2E home navigation and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/studio_browser.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "checks.append('подтверждение конфликта, отмена без остановки, добавление второго источника')\n        button('Попробовать без микрофона');third=ready()":
              "checks.append('подтверждение конфликта, отмена без остановки, добавление второго источника')\n        tab('Главная');button('Попробовать без микрофона');third=ready()",
              "checks.append('создание проекта в выборе, возврат без потерь и сохранение в новый проект')\n        button('Попробовать без микрофона');ready();button('Отменить заметку')":
              "checks.append('создание проекта в выборе, возврат без потерь и сохранение в новый проект')\n        tab('Главная');button('Попробовать без микрофона');ready();button('Отменить заметку')",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one marker, found {text.count(old)}: {old[:70]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/patch-browser-home-return.yml
          git config user.name "Kasha Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/studio_browser.py
          git commit -m "Fix browser returns to Home after note distribution"
          git push origin HEAD:refactor/kasha-core
