name: Rename app to Kasha
on:
  push:
    branches: [brand-kasha]
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename product everywhere
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          replacements = [
              ('THIRDBRAIN', 'KASHA'),
              ('ThirdBrain', 'Kasha'),
              ('thirdBrain', 'kasha'),
              ('thirdbrain', 'kasha'),
              ('3rdBrain', 'Kasha'),
              ('3rdbrain', 'kasha'),
              ('3RDBRAIN', 'KASHA'),
          ]
          skip_dirs = {'.git', '.gradle', 'build', 'node_modules', '.studio-python', 'studio-output', 'test-output'}
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.as_posix() == '.github/workflows/brand-rename.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          old_launch = Path('Запустить ' + '3rd' + 'Brain.command')
          new_launch = Path('Запустить Kasha.command')
          if old_launch.exists():
              old_launch.rename(new_launch)

          # Current test package becomes 1.1.4.
          for name in [
              'desktopApp/build.gradle.kts',
              'desktopApp/packaging/package-test.sh',
              '.github/workflows/studio.yml',
              'docs/TEST_BUILD.md',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace('1.1.3', '1.1.4'), encoding='utf-8')

          # Historical GitHub links point at the repository's old slug after the text rename;
          # keep the visible evidence identifiers but remove those stale links from docs.
          for path in [Path('README.md'), *Path('docs').rglob('*.md')]:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\[([^\]]+)\]\(https://github\.com/vvverman/Kasha/[^)]+\)', r'\1', text)
              text = re.sub(r'https://github\.com/vvverman/Kasha/\S+', '', text)
              path.write_text(text, encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # Kasha — локальные голосовые заметки

          **Записать → отправить на обработку → исправить текст → выбрать проект → новая заметка или дополнение существующей.**

          ## Тестовая версия для Mac

          **Kasha Test 1.1.4 — Apple Silicon, целевая macOS 13.3+.**

          Тестовый пакет не содержит весов Whisper Small и Qwen3 4B: они не уменьшены и не заменены другими моделями, а просто исключены из этой сборки. Реальными остаются микрофон, waveform, обработка и сохранение аудио, плеер, проекты, заметки, редактор, закрепления и настройки. Распознавание и LLM-действия в тестовой версии явно имитируются.

          ### Что изменилось в 1.1.4

          - Продукт переименован в **Kasha** во всём исходном коде, интерфейсе, упаковке, web-адаптере, переменных окружения, bundle ID, локальном хранилище и документации.
          - macOS-приложение: `Kasha`; тестовый пакет: `Kasha Test`.
          - bundle ID: `ru.vrmn.kasha` / `ru.vrmn.kasha.test`.
          - данные тестовой сборки: `~/Library/Application Support/Kasha Test`.
          - web storage и служебные переменные используют префикс `kasha` / `KASHA_`.
          - CI отдельно проверяет, что прежнее имя больше не встречается ни в содержимом репозитория, ни в именах файлов.

          Сохраняется Brain UI: один закрытый слой компонентов поверх Compose Foundation/UI. Экран новой заметки после записи и редактор сохранённой заметки используют один `BrainEditableNote`, а пустая Главная показывает смысловую графику голосовой заметки вместо декоративной ветки.

          ## Интерфейс и данные

          Один мобильный интерфейс на Kotlin Multiplatform / Compose, шириной до 430 dp. Светлая и тёмная темы, Onest, собственные пиктограммы. Восемь языков интерфейса: русский, английский, испанский, французский, немецкий, украинский, белорусский, казахский.

          На Главной одна текущая запись. Плеер и нижняя навигация всегда видны. Навигация не прерывает запись. Все сохранённые заметки принадлежат проектам. Аудио сохраняется без длинных пауз, с выбранными качеством и темпом.

          ## Разработка

          Общие правила — `shared/commonMain`, экраны и состояние — `composeApp/commonMain/kotlin/brain/studio`, macOS-аудиоадаптеры и упаковка — `desktopApp`. Web использует те же экраны с браузерными адаптерами и локальным Ktor-сервисом.

          Документы: `docs/SPEC.md`, `docs/BRAIN_UI.md`, `docs/TEST_BUILD.md`.
          EOF

          # Remove heredoc indentation introduced by YAML block indentation.
          sed -i 's/^          //' README.md

          cat > scripts/check-brand-boundary.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import re
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          FORBIDDEN = re.compile(r"(?:3rd|third)brain", re.IGNORECASE)
          SKIP_DIRS = {'.git', '.gradle', 'build', 'studio-output', 'test-output', 'node_modules', '.studio-python'}
          violations = []

          for path in ROOT.rglob('*'):
              rel = path.relative_to(ROOT)
              if any(part in SKIP_DIRS for part in rel.parts):
                  continue
              if FORBIDDEN.search(str(rel)):
                  violations.append(f'path: {rel}')
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if FORBIDDEN.search(line):
                      violations.append(f'{rel}:{number}: {line.strip()}')

          if violations:
              print('Legacy brand references found:', file=sys.stderr)
              print('\n'.join(violations), file=sys.stderr)
              sys.exit(1)
          print('Brand boundary: OK')
          PY
          sed -i 's/^          //' scripts/check-brand-boundary.py
          chmod +x scripts/check-brand-boundary.py

          python3 - <<'PY'
          from pathlib import Path
          for name in [
              '.github/workflows/studio.yml',
              '.github/workflows/kotlin.yml',
              '.github/workflows/macos.yml',
              '.github/workflows/models.yml',
          ]:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'scripts/check-brand-boundary.py' in text:
                  continue
              marker = '      - uses: actions/checkout@v4\n'
              insertion = marker + '      - name: Проверка бренда\n        run: python3 scripts/check-brand-boundary.py\n'
              if marker not in text:
                  raise SystemExit(f'checkout marker not found in {name}')
              path.write_text(text.replace(marker, insertion, 1), encoding='utf-8')
          PY

          # Make current test notes explicit about the new app identity.
          cat >> docs/TEST_BUILD.md <<'EOF'

          ## Переименование

          В 1.1.4 продукт называется **Kasha**. Тестовое macOS-приложение — **Kasha Test**, данные — `~/Library/Application Support/Kasha Test`, bundle ID — `ru.vrmn.kasha.test`. Служебные переменные окружения используют префикс `KASHA_`.
          EOF
          sed -i 's/^          //' docs/TEST_BUILD.md

          # Replace the historical 1.1.3 verification note with a brand-neutral record.
          cat > docs/VERIFICATION_1_1_3.md <<'EOF'
          # Проверки Kasha Test 1.1.3 — 11 сентября 2026

          Исторический отчёт тестовой сборки, выпущенной до текущего переименования исходного проекта. В документации используется актуальный бренд Kasha.

          Программный коммит: `6a4ca55e7a9c7b65c6be464a0f2d622f98e0573e`.

          - macOS build/self-test: run `34564934511`.
          - общий код и браузерный путь: run `34564934407`.
          - установщик: artifact `10185719792`.

          Оба прогона завершились успешно. Был добавлен закрытый слой Brain UI, единый `BrainEditableNote`, смысловой empty-state Главной и CI-граница базовых UI-контролов.

          В macOS-артефакте было 93 уникальных Kotlin-теста: 0 failures, 0 errors, 0 skipped. Браузерный сценарий прошёл 11 групп действий, `pageErrors = []`.

          Нативная самопроверка была выполнена на macOS 15.7.9 arm64. Пакет был ad-hoc подписан, без Developer ID и notarization.
          EOF
          sed -i 's/^          //' docs/VERIFICATION_1_1_3.md

          # This one-off workflow must not survive in the final tree.
          rm .github/workflows/brand-rename.yml

          python3 scripts/check-brand-boundary.py
          if find . -type f | grep -Eiv '^./\.git/' | grep -Ei '(3rdbrain|thirdbrain)'; then
            echo 'Legacy brand remains in a path' >&2
            exit 1
          fi

          git config user.name 'Kasha rename bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: rename app to Kasha'
          git push origin HEAD:brand-kasha
