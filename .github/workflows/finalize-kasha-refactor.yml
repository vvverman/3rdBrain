name: Finalize Kasha refactor

on:
  push:
    branches:
      - refactor/kasha-core
    paths:
      - .github/workflows/finalize-kasha-refactor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kasha-core
          fetch-depth: 0
      - name: Apply final patch
        run: python3 scripts/finalize-refactor.py
      - name: Commit final patch
        run: |
          git config user.name "Kasha Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/studio_browser.py docs/SPEC.md
          git diff --cached --quiet || git commit -m "Cover tasks sorting and strict icon motion in final spec"
          git push origin HEAD:refactor/kasha-core
