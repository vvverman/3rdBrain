name: Patch browser navigation

on:
  push:
    branches:
      - refactor/kasha-core
    paths:
      - .github/workflows/patch-browser-nav.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/kasha-core
          fetch-depth: 0
      - name: Patch E2E navigation and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/studio_browser.py')
          text = path.read_text(encoding='utf-8')
          old = "tab('Проекты');click('button',re.compile('^Отредактированная заметка'))"
          new = "tab('Проекты');click('button',re.compile('^Твой первый проект'));click('button',re.compile('^Отредактированная заметка'))"
          if text.count(old) != 1:
              raise SystemExit(f'expected one navigation marker, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/patch-browser-nav.yml
          git config user.name "Kasha Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/studio_browser.py
          git commit -m "Fix browser navigation during active recording"
          git push origin HEAD:refactor/kasha-core
