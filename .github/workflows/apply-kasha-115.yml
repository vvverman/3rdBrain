name: Apply Kasha 1.1.5 payload
on:
  push:
    branches: [tasks-sorting-kasha-ui]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .kasha-payload/part-* | base64 -d > /tmp/kasha115.zip
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile

          root = Path('.')
          with zipfile.ZipFile('/tmp/kasha115.zip') as z:
              z.extractall(root)
          for rel in json.loads((root / '.kasha-delete.json').read_text()):
              path = root / rel
              if path.exists():
                  path.unlink()
          (root / '.kasha-delete.json').unlink()
          PY
          rm -rf .kasha-payload
          python3 scripts/check-brand-boundary.py
          python3 scripts/check-ui-boundary.py
          git config user.name 'Kasha build bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add tasks, sorting and Kasha UI'
          git push origin HEAD:tasks-sorting-kasha-ui
