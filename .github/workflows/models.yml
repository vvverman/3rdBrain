name: Реальные локальные модели
on:
  push:
    branches: [local-models]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      THIRDBRAIN_TOOLS_HOME: ${{ github.workspace }}/.local-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Системные инструменты
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng cmake
      - uses: actions/cache@v4
        with:
          path: .local-models
          key: local-models-v1-${{ runner.os }}-${{ hashFiles('scripts/setup-models.sh') }}
      - name: Подготовить настоящие веса и движки
        run: |
          set -o pipefail
          bash scripts/setup-models.sh 2>&1 | tee setup-models.log
      - name: Сборка и модульные тесты
        run: gradle --no-build-cache :shared:jvmTest :composeApp:jvmTest :runtime:test :runtime:installDist
      - name: Русская речь → Whisper → LLM → проект → заметка
        run: |
          set -o pipefail
          source "$THIRDBRAIN_TOOLS_HOME/models.env"
          export THIRDBRAIN_HOME=$(mktemp -d)
          export HF_HUB_OFFLINE=1
          bash runtime/build/install/runtime/bin/runtime > models-runtime.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python tests/real_models.py 2>&1 | tee real-models.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-models-${{ github.sha }}
          path: |
            setup-models.log
            models-runtime.log
            real-models.log
            test-output/real-models
            shared/build/test-results
            composeApp/build/test-results
            runtime/build/test-results
          retention-days: 7
