name: Kotlin Multiplatform
on:
  push:
    branches: [kmp-web-rewrite, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Исходники проверяемого коммита
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-source-${{ github.sha }}
          path: source.zip
          retention-days: 7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
          cache-read-only: false
      - name: Аудиоинструменты и проверка загрузчика
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          bash -n run-web.sh scripts/gradle.sh
          EXPECTED=$(sed -n 's/^SHA256=//p' scripts/gradle.sh)
          ACTUAL=$(curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.14.5-bin.zip.sha256)
          test "$EXPECTED" = "$ACTUAL"
      - name: Сборка и тесты Kotlin
        run: |
          set -o pipefail
          gradle --no-build-cache --continue :shared:jvmTest :composeApp:jvmTest :runtime:test :composeApp:wasmJsBrowserDistribution :runtime:installDist 2>&1 | tee kotlin.log
      - name: Браузерный сценарий
        run: |
          python -m pip install playwright==1.55.0
          export THIRDBRAIN_HOME=$(mktemp -d)
          bash run-web.sh --no-build > runtime.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python tests/browser_smoke.py
      - name: Готовая локальная веб-сборка
        run: |
          mkdir -p portable/web
          cp -R runtime/build/install/runtime portable/runtime
          cp -R composeApp/build/dist/wasmJs/productionExecutable/. portable/web/
          cp README.md portable/
          printf '#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")"\nexport THIRDBRAIN_WEB_ROOT="$PWD/web"\nexec bash runtime/bin/runtime\n' > portable/start.sh
          cd portable && zip -qr ../3rdBrain-web.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-check-${{ github.sha }}
          path: |
            kotlin.log
            runtime.log
            test-output
            3rdBrain-web.zip
            shared/build/test-results
            composeApp/build/test-results
            runtime/build/test-results
            composeApp/build/dist/wasmJs/productionExecutable
            runtime/build/install
          retention-days: 7
