name: Kotlin Multiplatform

on:
  push:
    branches: [kmp-web-rewrite, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Shared tests
        run: gradle :shared:jvmTest
      - name: Runtime tests
        run: gradle :runtime:test
      - name: Web build
        run: gradle :composeApp:wasmJsBrowserDistribution
