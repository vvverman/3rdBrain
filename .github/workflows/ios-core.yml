name: Kasha Core iOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kasha-core-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Compile Kasha Core for iPhone and Apple Silicon simulator
        run: |
          set -o pipefail
          gradle :kashaCore:compileKotlinIosArm64 :kashaCore:compileKotlinIosSimulatorArm64 2>&1 | tee ios-core.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kasha-core-ios-${{ github.sha }}
          retention-days: 14
          path: ios-core.log
