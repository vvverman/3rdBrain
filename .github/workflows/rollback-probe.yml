name: Диагностика отката SwiftData
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Проверить поведение SwiftData
        shell: bash
        run: |
          set -o pipefail
          xcrun swiftc -parse-as-library scripts/rollback_probe.swift -o /tmp/rollback-probe
          /tmp/rollback-probe 2>&1 | tee rollback-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-probe
          path: rollback-probe.log
          retention-days: 7
