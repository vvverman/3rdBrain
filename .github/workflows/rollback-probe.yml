name: Диагностика отката SwiftData
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Проверить восстановление в коде приложения
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version
          xcrun swiftc -swift-version 5 -parse-as-library \
            ThirdBrain/Core/BrainCore.swift ThirdBrain/Models.swift \
            ThirdBrain/LocalStore.swift ThirdBrain/RestorePoints.swift \
            scripts/rollback_probe.swift -o /tmp/rollback-probe
          /tmp/rollback-probe 2>&1 | tee rollback-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollback-probe
          path: rollback-probe.log
          retention-days: 7
